name: Manual CI - go-fuzz claim

# Fork-only claim workflow (Nitjsefnie-OSC): runs the upstream go-fuzz job's
# two fuzz smoke commands against an arbitrary ref. Mirrors the job shape in
# .github/workflows/ci.yml (pins included). Not part of upstream CI.

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Git ref to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: osc-adv-jwt-fuzz-${{ inputs.target_ref }}
  cancel-in-progress: true

jobs:
  go-fuzz-claim:
    name: osc-adv-go-fuzz
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Provenance
        run: |
          echo "target_ref=${{ inputs.target_ref }}"
          git rev-parse HEAD

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run Go fuzz smoke (chat request parser)
        run: go test -fuzz=FuzzParseChatCompletionRequest -fuzztime=30s ./services/proxy/internal/llm/

      - name: Run Go fuzz smoke (JWT splitter and header validator)
        run: go test -fuzz=FuzzSplitJWTAndHeader -fuzztime=30s ./services/auth/internal/sessionjwt/
