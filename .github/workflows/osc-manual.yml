name: Manual CI

# Fork-only dispatch wrapper (Nitjsefnie-OSC): validates an arbitrary ref with
# the repository's own checks. Not part of upstream CI.

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Git ref to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: osc-manual-${{ inputs.target_ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: osc-validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Provenance
        run: |
          set -euo pipefail
          echo "tested_target_ref=${{ inputs.target_ref }}"
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
            exit 1
          fi
          printf 'checked-out SHA: %s\n' "$checked_out_sha"

      - name: Repo guards
        run: |
          bash .github/scripts/check-repo-layout.sh
          bash .github/scripts/test-ci-gate.sh

      - name: markdownlint
        run: |
          npm ci --prefix .github/markdownlint --ignore-scripts
          .github/markdownlint/node_modules/.bin/markdownlint-cli2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Benchmark pipeline unit tests
        run: python benchmarks/scripts/test_pipeline.py

      # Mirrors the upstream benchmark-gate job's context artifact step; runs
      # only when the target_ref carries the module, and says so when it skips.
      - name: Context artifact gate tests
        run: |
          if [ ! -f benchmarks/scripts/test_context_assembly_artifact.py ]; then
            echo "SKIP loud: target_ref has no benchmarks/scripts/test_context_assembly_artifact.py"
            exit 0
          fi
          bash infra/scripts/context-uv-sync.sh
          uv pip install --python services/context/.venv/bin/python \
            --only-binary :all: --require-hashes \
            -r .github/requirements/jsonschema.txt
          services/context/.venv/bin/python -m pytest benchmarks/scripts/test_context_assembly_artifact.py

      # Mirror the upstream site-build job's gates for a target_ref that
      # carries the site workspace (the old web/ workspace is gone since the
      # site rebuild), and say so loudly when it skips.
      - name: Site workspace guard
        run: |
          if [ ! -f site/package.json ]; then
            echo "SKIP loud: target_ref has no site/ workspace"
            exit 0
          fi

      - name: Set up pnpm site
        if: ${{ hashFiles('site/package.json') != '' }}
        uses: ./.github/actions/setup-pnpm-node

      - name: Site typecheck
        if: ${{ hashFiles('site/package.json') != '' }}
        run: pnpm --filter site typecheck

      - name: Site e2e tests
        if: ${{ hashFiles('site/package.json') != '' }}
        run: |
          pnpm --filter site exec playwright install --with-deps chromium # NOSONAR
          pnpm --filter site test:e2e
